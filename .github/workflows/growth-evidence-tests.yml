name: Growth Evidence Regression
on:
  push:
    branches: [main]
    paths:
      - "content-agents/growth-multiplier.mjs"
      - "content-agents/growth-multiplier.test.mjs"
      - "content-agents/v60-retention-experiments.mjs"
      - "content-agents/v60-retention-experiments.test.mjs"
      - "content-agents/verified-performance-evidence.mjs"
      - "system-agents/release-readiness.mjs"
      - "system-agents/release-readiness.test.mjs"
      - "system-agents/worker.mjs"
      - "content-agents/certification-runner.mjs"
      - "video-renderer/visual-storyboard.mjs"
      - "video-renderer/visual-storyboard.test.mjs"
      - "video-renderer/free-ai-render-v2.mjs"
      - "video-renderer/stock-video-library.mjs"
      - "video-renderer/daily-factory.mjs"
      - "video-renderer/Dockerfile"
      - "content-agents/zero-credit-review.mjs"
      - ".github/workflows/growth-evidence-tests.yml"
  pull_request:
    paths:
      - "content-agents/growth-multiplier.mjs"
      - "content-agents/growth-multiplier.test.mjs"
      - "content-agents/v60-retention-experiments.mjs"
      - "content-agents/v60-retention-experiments.test.mjs"
      - "content-agents/verified-performance-evidence.mjs"
      - "system-agents/release-readiness.mjs"
      - "system-agents/release-readiness.test.mjs"
      - "system-agents/worker.mjs"
      - "content-agents/certification-runner.mjs"
      - "video-renderer/visual-storyboard.mjs"
      - "video-renderer/visual-storyboard.test.mjs"
      - "video-renderer/free-ai-render-v2.mjs"
      - "video-renderer/stock-video-library.mjs"
      - "video-renderer/daily-factory.mjs"
      - "video-renderer/Dockerfile"
      - "content-agents/zero-credit-review.mjs"
      - ".github/workflows/growth-evidence-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measured-growth-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test fail-closed growth classifier
        run: node --test content-agents/growth-multiplier.test.mjs content-agents/v60-retention-experiments.test.mjs system-agents/release-readiness.test.mjs video-renderer/visual-storyboard.test.mjs
      - name: Check runtime and certification syntax
        run: |
          node --check content-agents/certification-runner.mjs
          node --check system-agents/worker.mjs
          node --check system-agents/release-readiness.mjs
          node --check video-renderer/free-ai-render-v2.mjs
          node --check video-renderer/stock-video-library.mjs
          node --check video-renderer/daily-factory.mjs
          node --check content-agents/zero-credit-review.mjs
