name: Growth Evidence Regression
on:
  push:
    branches: [main]
    paths:
      - "content-agents/growth-multiplier.mjs"
      - "content-agents/growth-multiplier.test.mjs"
      - "content-agents/verified-performance-evidence.mjs"
      - ".github/workflows/growth-evidence-tests.yml"
  pull_request:
    paths:
      - "content-agents/growth-multiplier.mjs"
      - "content-agents/growth-multiplier.test.mjs"
      - "content-agents/verified-performance-evidence.mjs"
      - ".github/workflows/growth-evidence-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measured-growth-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test fail-closed growth classifier
        run: node --test content-agents/growth-multiplier.test.mjs
