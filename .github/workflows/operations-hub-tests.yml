name: Operations Hub Safety Tests
on:
  pull_request:
    paths:
      - "ops-hub/**"
      - ".github/workflows/operations-hub-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run local, no-cost workflow tests
        run: node --test ops-hub/tests/*.test.mjs
