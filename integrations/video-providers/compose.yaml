name: oms-local-studio
services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.local
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    env_file:
      - .env
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
    ports:
      - "${OMS_BIND_ADDRESS:-127.0.0.1}:${OMS_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
